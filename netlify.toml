[build]
  command = "npm run build"
  publish = "dist"

[context.deploy-preview]
  command = "npm test && npm run build && npm run test:build-contract"

[[redirects]]
  from = "https://www.mathpracticeonline.com/*"
  to = "https://mathpracticeonline.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
